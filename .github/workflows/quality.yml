name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  template-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check workflow and helpers
        run: make check
